        .dots {

        }

        .dots span {
            display: inline-block;
            height: 10px;
            width: 10px;
            border-radius: 50%;
            background-color: grey;
            margin: 0 10px;
        }

        .dots-container::before {
            pointer-events: none;
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom,
                    transparent,
                    transparent,
                    transparent,
                    transparent,
                    transparent,
                    transparent,
                    rgba(0, 0, 0, 0.2),
                    rgba(0, 0, 0, 0.8),
                    rgba(0, 0, 0, 1),
                    rgba(0, 0, 0, 1));
            /* z-index: 1; 这个加了就不好了*/

        .dots span.active {
            background-color: #fff;
            height: 12px;
            width: 12px;
        }

        .left {
            border-radius: 2%;
            text-align: left;
            left: 0;
            bottom: 110px;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 80px;
            position: absolute;
            line-height: 80px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .left:hover {
            cursor: pointer;
        }

        .right {

            line-height: 80px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .right:hover {
            cursor: pointer;
        }

        .stop:hover {
            transform: scale(0.95);
            box-shadow: 0 0 20px 2px rgba(0, 0, 0, 0.5);
        }
        .active{
            opacity:1;
        }

<script>
    
    function create(number,sec){
    let dot = document.querySelectorAll(`.lunbo${number} .dot`);
    let imgList=document.querySelectorAll(`.lunbo${number} .normal`)
    let num = 1;
    // let flag1 = false
    let flag2 = false
    function createLunBo(box, sec) {
        // let img = document.querySelector(`.${box} img`);
        
        const move = function () {
            num++;
            if (num > 4) {
                num = 1;
            }
            imgList.forEach(item=>{
                item.classList.remove('active')
            })
            imgList[num-1].classList.add("active")
            dot.forEach(item => {
                item.classList.remove("active");
            })
            dot[num - 1].classList.add("active")
        }
        // const timer = setInterval(move, `${sec}`);
        //闭包的思路是返回一个包含两个方法的对象
        let timer = setInterval(move, sec);
        return {
            pause: () => {
                clearInterval(timer)
            },
            start: () => {
                timer = setInterval(move, sec);
            }
        };
        //返回是返回了，但是你存在哪里了？
        //不要用ai
    }
    // let timer1 = createLunBo("lunbo", 3000)
    let timer = createLunBo("lunbo", sec);
    
    //封装重启计时器模块
    function reset() {
        timer.pause();
        timer.start();
    }
    //封装更新图片显示模块
    function updateImg(num){
        imgList.forEach(item=>{
            item.classList.remove('active')
            })
        imgList[num-1].classList.add("active")
        dot.forEach(item => {
            item.classList.remove("active");
        })
        dot[num - 1].classList.add("active")
        reset()
    }
    //以下是暂停器模块
    const control = document.querySelector(`#stop0${number}`);
    control.addEventListener("click", function () {
        flag2 = !flag2
        if (flag2) {
            timer.pause();
            control.innerHTML = `START<br>`
        }
        else {
            timer.start();
            control.innerHTML = `STOP<br>`
        }
    });

    //以下是小圆点模块
    let dot1 = document.querySelector(`.lunbo${number} .dot1`);
    dot1.classList.add("active");
    dot.forEach(item=>{
        item.addEventListener('click',function(){
            num=Array.from(dot).indexOf(this)+1;
            //from把类数组转换为数组，indexof查找第一个指定元素的位置
            updateImg(num);
        })
    })

    //这是鼠标悬停模块儿
    const img = document.querySelector(`.lunbo${number} .container img`)
    img.addEventListener("mouseover", function () {
        timer.pause();
    })
    img.addEventListener("mouseout", function () {
        timer.start();
    })

    //以下是左右按键模块
    let leftButton = document.querySelector(`.lunbo${number} .container .left`)
    let rightButton = document.querySelector(`.lunbo${number} .container .right`)
    leftButton.addEventListener("click", function () {
        console.log("leftButton点击成功")
        num--;
        if (num < 1) {
            num = 4;
        }
        updateImg(num);
    })
    rightButton.addEventListener("click", function () {
        console.log("rightButton点击成功")
        num++;
        if (num > 4) {
            num = 1;
        }
        updateImg(num);
    })
    }
    create(2,1500);
